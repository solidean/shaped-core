    notes: |
      AMD FSR 3.1's analytic upscaler, from the FidelityFX SDK 2.3 tree: its host C++, its HLSL passes, and the support
      headers both include — 54 files and under 1 MB, where the repository around them carries samples, media and signed DLLs.
      Every file here is MIT; docs/license.md lists them among its MIT exceptions, while other parts of the SDK are under
      AMD's binary-only license, which is why this takes named files rather than the tree.

      WE RUN AMD'S HOST CODE AND OUR OWN BACKEND.
      The host code reaches the GPU only through its `FfxInterface` table, and shaped-rendering implements that table over
      sg, compiling the passes itself through slib.
      AMD's precompiled shader headers and the FidelityFX_SC tool that makes them are not in the public tree at all, and
      neither is `amdinternal/`, which the host code includes for a debug watermark and a git hash.
      fetch-fidelityfx.py installs two no-op stand-ins for those from shim/, so the fetched tree builds as it stands.

      Windows only, for now: the host code calls MSVC's secure CRT (`wcscpy_s`, `getenv_s`, `strncpy_s`) and uses
      `__declspec` unconditionally, and nothing here has been built against another C runtime yet.
