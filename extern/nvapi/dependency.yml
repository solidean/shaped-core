    notes: |
      NVIDIA's HLSL shader extensions, the three headers an `nvapi` fill's text includes (EMIT-265), and nothing of the API library.
      SGL writes `#include "nvHLSLExtns.h"` and a host puts this folder on DXC's include path; SGL's DXIL writer encodes the same protocol itself.
      Each header carries NVIDIA's MIT notice, which `license_text` repeats.

      FETCHED ON REQUEST, because only tests read it: they compile an nvapi fill's text with DXC, and skip without it.
      `uv run extern/nvapi/fetch-nvapi.py` fetches it; nothing in dev.py does.

      R615, the last release older than two weeks when it was pinned; SER through NvHitObject has stood since R520.
