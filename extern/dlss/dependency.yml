# Pin and license for the upstream fetched here.
# fetch-dlss.py reads its pin from this file.
# tools/dev/lib/pipeline/prereqs.py scans a `pin_hash:` line to decide whether .install/ is current — this dependency is
# NOT in that list, and the key below exists so the same staleness check works when it is run by hand.

upstreams:
  - name: DLSS
    homepage: https://github.com/NVIDIA/DLSS
    install: on-request
    source: github-files
    repo: https://github.com/NVIDIA/DLSS
    track: github-releases
    version: 310.9.1
    tag: v310.9.1
    digest_algo: sha256

    # The pin over the whole set: the sha256 of the `path sha256` lines below, in order.
    # One hash to compare against .install/pin.txt, while every file is still verified on its own.
    pin_hash: 8840fc53ee9c984cd9db3e750066b9d9a9ec00264946eed3c7263688c88076b7

    license: LicenseRef-NVIDIA-RTX-SDK
    license_files: [.install/LICENSE.txt]
    used_by: shaped-rendering — sr::dlss_rr_routine (the DLSS Ray Reconstruction denoise member)
    notes: |
      PROPRIETARY, and the reason this dependency is never fetched by default.
      The license is NVIDIA's own rather than an OSI one: it permits redistribution of the runtime DLL with an
      application, and it is not a license the repository can accept on a user's behalf.
      So there is no entry in prereqs.py and no configure step that fetches it — `uv run extern/dlss/fetch-dlss.py`
      is a deliberate act, and SR_HAS_DLSS stays 0 until someone performs it.

      Only what a dx12 Ray Reconstruction integration needs is fetched, rather than the repository:
      the headers, the import library, and nvngx_dlssd.dll.
      The full tree carries the super-resolution and frame-generation runtimes for five platforms, which is several
      hundred megabytes of things we do not call.

      nvngx_dlssd.dll is REDISTRIBUTABLE and must be staged next to the binary that loads it; it is 48 MB, which is
      why it is gitignored rather than committed.
      NVIDIA ships the super-resolution runtime (nvngx_dlss.dll) beside it — Ray Reconstruction does not need it, and
      it is not fetched.

