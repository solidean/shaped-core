# Pin and license for the upstream fetched here.
# fetch-oidn.py reads its pin from this file; the per-OS asset layout and the install plan stay in the script.
# tools/dev/lib/pipeline/prereqs.py scans this file for the `pin_hash:` line to decide whether .install/ is current,
# without paying to start Python — keep that key on a line of its own.

upstreams:
  - name: OIDN
    homepage: https://www.openimagedenoise.org
    install: fetched
    source: github-release
    repo: https://github.com/RenderKit/oidn
    track: github-releases
    version: 2.5.1
    tag: v2.5.1
    digest_algo: sha256
    # Per-OS assets, as DXC has: one release, one archive per platform, different layouts inside.
    asset_windows: oidn-2.5.1.x64.windows.zip
    pin_hash_windows: f11f91bc072a5e3a564515724cb72ab8fcfbc445c84a84c197ff9b16cc01396f
    asset_linux: oidn-2.5.1.x86_64.linux.tar.gz
    pin_hash_linux: 743c3e2aff8c220d5d70fe6cb970fb3d36f2702d2693c61d1d148e404cf37cd6
    asset_macos: oidn-2.5.1.arm64.macos.tar.gz
    pin_hash_macos: 98e0aca8e7ab69e9f4f0191582a500fd8b0d9085d68662f18ab6469e934a6efd
    # The release is per-architecture as well as per-OS, and these three machines have no asset at all.
    # Each pinned archive is built for exactly one instruction set, so fetching it anywhere else gets as far as the linker refusing the import library.
    unavailable_on: [windows-arm64, linux-arm64, macos-x64]
    license: Apache-2.0
    license_files: [.install/LICENSE.txt, .install/LICENSE-third-party-programs.txt, .install/LICENSE-oneTBB.txt]
    used_by: shaped-rendering — sr::denoise_method::oidn
    notes: |
      Intel Open Image Denoise: a trained denoiser for path-traced images, and the one non-native member that runs without vendor hardware.
      Apache-2.0, so it is `fetched` like SDL3 rather than `on-request` like the two NVIDIA SDKs — nothing here is a license a person has to accept.
      `prereqs.ensure_oidn` hydrates it on configure, and SC_SKIP_OIDN is the way out for a checkout that does not want to pay 53 MB for it.

      IT IS BIG, AND THAT WAS THE OPEN QUESTION.
      The Windows archive is 56.6 MB compressed and 83.1 MB unpacked across 34 files.
      Nearly all of it is one file: OpenImageDenoise_core.dll at 50.6 MB, which is where the trained weights live, so no install plan can make this dependency small.
      The CPU-only subset fetch-oidn.py installs is 16 files and 52.8 MB unpacked — the same order as SDL3's 49.6 MB, which is already fetched by default, which is what settles the policy.

      CPU ONLY FOR NOW, which is a size decision AND a capability one.
      Dropping the CUDA, HIP and SYCL device modules and their Level Zero loaders saves 22 MB of the 83.
      They would buy nothing yet: OIDN's GPU devices run on their own API and share memory with ours through an OS handle, which needs exportable memory and shared fences that sg does not have.
      See libs/graphics/shaped-graphics/docs/TODO.md.
      OIDN on the CPU needs neither, because it goes through the existing download and upload.
      When sg grows those, the extract list here grows with them.

      ALL THREE LAYOUTS ARE NOW UNPACKED, and the two Unix ones differ from Windows in three ways that all matter.
      Each library is one versioned real file plus the unversioned and soname symlinks onto it, oneTBB is named `tbb` rather than Windows' `tbb12`, and every library carries an RPATH of `$ORIGIN/../lib`.
      So fetch-oidn.py carries symlinks through, keeps both oneTBB spellings, and leaves the Unix libraries in lib/ rather than flattening them into bin/ as the Windows shape would suggest.
      It checks the installed names rather than only their count, because all three of those mistakes produced an install with a plausible number of files in it.

      x64 WINDOWS, x86_64 LINUX AND arm64 macOS ARE THE WHOLE RELEASE.
      `unavailable_on` names the three remaining machines, which are skipped rather than handed an archive for another instruction set.
      The x86_64 macOS asset exists upstream and stays deliberately unpinned, since Apple silicon is the tier this repo targets.
