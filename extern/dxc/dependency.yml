# Pin and license for the upstream fetched here.
# download-dxc.py reads its pin from this file; the arch map and the release's member layout stay in the script.
# tools/dev/lib/pipeline/prereqs.py scans this file for the `pin_hash:` line to decide whether .install/ is current,
# without paying to start Python — keep that key on a line of its own.

upstreams:
  - name: DXC
    homepage: https://github.com/microsoft/DirectXShaderCompiler
    install: fetched
    source: github-release
    repo: https://github.com/microsoft/DirectXShaderCompiler
    track: github-releases
    version: 1.9.2602.24
    tag: v1.9.2602.24
    digest_algo: sha256
    # Per-OS assets: the same release ships a Windows zip and a Linux tarball, with different layouts and different
    # license members. `pin_hash` for the host is resolved at load, so everything downstream sees one value.
    # prereqs.py's line scan looks for the host's suffixed key first, which is what keeps a Linux checkout from
    # re-fetching on every configure because it matched the Windows hash.
    asset_windows: dxc_2026_05_27.zip
    pin_hash_windows: cf658aacf070d3045e31b8f1f8a696c2945f37c1095019481ef7c513368db3b4
    asset_linux: linux_dxc_2026_05_26.x86_64.tar.gz
    pin_hash_linux: 928b3e9986d11dc4279050e02340950c29bcbd1e5efb9d3ded9669dade37639d
    # The release ships no macOS build at all, and its Linux tarball is x86_64 only, so there is nothing to pin on either.
    # Declared rather than left missing: a per-OS key absent for the host is an un-ported dependency and stays an error,
    # and without this the whole manifest set failed to load on a Mac — taking `deps list` and `deps licenses` with it.
    unavailable_on: [macos, linux-arm64]
    license: LicenseRef-Microsoft-DXC-Binary
    # The Windows zip ships the MS terms, an MIT text and the LLVM license; the Linux tarball ships no MIT text.
    # download-dxc.py maps each by name, so every platform writes the same file for the same text.
    license_files: [.install/LICENSE.txt, .install/LICENSE-LLVM.txt, .install/LICENSE-MIT.txt]
    used_by: shaped-shader-compiler-dxc — HLSL to sg::compiled_shader
    notes: |
      The one dependency that is not permissively licensed, and the only one we take as a binary rather than as source.
      DirectXShaderCompiler's *source* is NCSA, but the prebuilt release we download ships Microsoft Software License Terms — a proprietary EULA, which is why the SPDX field is a LicenseRef rather than NCSA.
      It permits redistributing the "distributable code" (dxcompiler.dll, dxil.dll) with an application, which is exactly how we use it.
      It is on the license allowlist as a named exception rather than by category; re-read the terms on any version bump.
      Building DXC from source instead would be an LLVM-scale build, which is why we take the binary.
      The releases name their license members per platform, so download-dxc.py maps each by name onto the files `license_files` declares.

      HELD BACK DELIBERATELY: the two newer candidates are both unusable, for unrelated reasons, so this pin stays until a release fixes one of them.

      v1.9.2607 is tainted by its packaging.
      Its Linux asset ships the WINDOWS header set, member for member, so there is no WinAdapter.h in it at all — and dxcapi.h includes that header unconditionally off Windows.
      The release therefore does not compile for any non-Windows consumer, and no amount of install-plan work here can fix it.
      That asset also carries 515 MB of object files and static archives.
      That is https://github.com/microsoft/DirectXShaderCompiler/issues/8770 — the same regression's other symptom, and the issue to watch.
      Its Windows zip is installable but writes `bin\x64\...` with backslash separators and spells the MIT member LICENCE-MIT.
      download-dxc.py absorbs both, and they are the tell that the packaging changed wholesale rather than the layout being edited.

      v1.10.2605.37 (the Shader Model 6.10 preview line) packages correctly but ships DIFFERENT license terms, and they are the reason this dependency is on the allowlist at all.
      The preview EULA drops the entire DISTRIBUTABLE CODE section: "distributable" appears seven times in the terms we hold and zero times in those.
      Its "share, publish, distribute" prohibition therefore loses the carve-out that lets us ship dxcompiler with an application.
      It also adds TIME-SENSITIVE SOFTWARE, terminating 30 days after a commercial release first becomes available, and PRE-RELEASE SOFTWARE.
      A pin whose license expires and forbids redistribution is not one we can ship, whatever its binaries do.
      Any move to the 1.10 line needs the terms re-read on the release actually taken.
