# babel-serializer's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
rules:
  # --- baseline begin: generated by `dev.py lint bless-includes` — curate by moving entries above this line ---
  - kind: allow-include
    value: <charconv>
    reason: baseline
  - kind: allow-include
    value: <cstring>
    reason: baseline
  - kind: allow-include
    value: <sqlite3.h>
    reason: baseline
  - kind: allow-include
    value: <stb_image.h>
    reason: baseline
  - kind: allow-include
    value: <stb_image_write.h>
    reason: baseline
  # --- baseline end ---
