# versioned-document-file's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
#
# Empty on purpose, and expected to stay that way: the SQLite engine is reached through babel::sqlite, so no sqlite3 header is ever included here.
# An entry blessing <sqlite3.h> in this library would mean the babel wrapper was bypassed instead of extended.

rules:
  - kind: allow-include
    value: <memory>
    reason: the store handle is POLYMORPHIC, and cc::shared_ptr's default traits place the control block at an offset derived from sizeof(T) of the static type, which a derived store would land inside — the named clean-core gap, and the third library to hit it after shaped-graphics and shaped-shader-library. Nothing to do with sqlite, which is still reached only through babel::sqlite.
    files:
      - src/versioned-document-file/store.hh
      - src/versioned-document-file/store.cc
      - src/versioned-document-file/impl/store_memory.hh
      - src/versioned-document-file/impl/store_memory.cc
      - src/versioned-document-file/impl/sqlite_actor.hh
      - src/versioned-document-file/impl/store_sqlite.hh
      - src/versioned-document-file/impl/store_sqlite.cc
      - tests/**

  - kind: allow-include
    value: <cstdio>
    reason: a guide benchmark prints a fixed-width table a human reads next to its write-up, which cc::format does not lay out — the same reason clean-core's benchmarks reach for it, and it never leaves tests/benchmarks/.
    files:
      - tests/benchmarks/**

  - kind: allow-include
    value: <chrono>
    reason: the loop benchmark times one-shot stages rather than repeatable throughput, so it needs a clock rather than clean-core's adaptive timer.
    files:
      - tests/benchmarks/**
