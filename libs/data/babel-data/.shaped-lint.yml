# babel-data's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.

rules:
  - kind: allow-include
    value: <charconv>
    reason: "from_chars is what a number is parsed with; issue: chore-babel-from-chars-to-cc-from-string"
    files: src/babel-data/data/json.cc
