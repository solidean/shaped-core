# shaped-graphics-language's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.

rules:
  - kind: allow-include
    value: <filesystem>
    reason: walking tests/corpus/ for its files, in the test binary only; clean-core has no directory listing yet
    files: tests/corpus/corpus-test.cc
