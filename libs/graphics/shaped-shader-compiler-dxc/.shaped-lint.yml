# shaped-shader-compiler-dxc's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
rules:
  # --- baseline begin: generated by `dev.py lint bless-includes` — curate by moving entries above this line ---
  - kind: allow-include
    value: <cstddef>
    reason: baseline
  - kind: allow-include
    value: <d3d12shader.h>
    reason: baseline
  - kind: allow-include
    value: <memory>
    reason: baseline
  - kind: allow-include
    value: <string>
    reason: baseline
  - kind: allow-include
    value: <vector>
    reason: baseline
  # --- baseline end ---
