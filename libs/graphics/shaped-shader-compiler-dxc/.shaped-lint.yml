# shaped-shader-compiler-dxc's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
#
# This library is a wrapper around a COM API, so the std:: it names is mostly what DXC's own signatures demand.

rules:
  - kind: allow-include
    value: <memory>
    reason: sg's handles ARE std::shared_ptr, and the compiled-shader results are handed back as one

  - kind: allow-include
    value: <locale.h>
    reason: pin_utf8_locale holds one reference to the locale DXC's ScopedLocale rebuilds per string conversion — POSIX newlocale is the only way to take it, and docs/thread-safety.md is what it buys
    files: src/shaped-shader-compiler-dxc/compiler.cc

  - kind: allow-include
    value: <d3d12shader.h>
    reason: the single include gate for the DXC / COM reflection interfaces — every other TU reaches them through this file
    files: src/shaped-shader-compiler-dxc/impl/dxc_common.hh

  - kind: allow-include
    value: <spirv_reflect.h>
    reason: the vendored SPIRV-Reflect, reached only from the SPIR-V reflection TU — a module carries its bindings in its own instruction stream, so reading them back is a parser rather than a query
    files: src/shaped-shader-compiler-dxc/impl/spirv_reflection.cc

  - kind: allow-include
    value: [<string>, <vector>]
    reason: "TODO: DXC's C++ API takes std::wstring arguments and returns std::vector; migrate the parts that are ours to cc::"
    files: src/**

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for]
    reason: a manual window test runs a real frame loop, which is where a wait belongs
    files:
      - tests/end-to-end-cube-window-test.cc
      - tests/end-to-end-raytraced-cube-window-test.cc

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for]
    reason: a pipeline or shader built inside a synchronous check helper, finished rather than left running past the test
    files:
      - tests/end-to-end-raster-cache-test.cc
      - tests/payload-packing-spike-test.cc
