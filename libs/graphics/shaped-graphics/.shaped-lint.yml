# shaped-graphics's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.

rules:
  # =========================================================================================================
  # sg's one sanctioned std:: deviation
  # =========================================================================================================

  - kind: allow-include
    value: <memory>
    reason: every sg *_handle IS a std::shared_ptr, and a polymorphic command_list is held by std::unique_ptr — the deviation docs/coding-guidelines.md argues for, and cc::shared_ptr does not yet carry the weak_ptr and aliasing-ctor uses this needs
    files: src/shaped-graphics/fwd.hh

  # =========================================================================================================
  # The SDK gates
  # =========================================================================================================
  # Each backend has ONE header that opens its SDK, brackets the `byte` typedef and is what every other TU in that backend includes.

  - kind: allow-include
    value: [<d3d12.h>, <dxgi1_6.h>]
    reason: the single include gate for the D3D12 / DXGI headers — every other dx12 TU reaches them through this file
    files: backends/dx12/src/shaped-graphics/backends/dx12/dx12_common.hh

  - kind: allow-include
    value: [<pdh.h>, <pdhmsg.h>]
    reason: the GPU Engine performance counters, which are the only route to GPU busy time on Windows — D3D12 exposes no utilization query at all
    files: backends/dx12/src/shaped-graphics/backends/dx12/dx12_gpu_load.cc

  - kind: allow-include
    value: <d3d12sdklayers.h>
    reason: the debug layer, needed only where the device is created — it leaks past the gate above, and belongs behind it eventually
    files: backends/dx12/src/shaped-graphics/backends/dx12/dx12_context.create.cc

  # =========================================================================================================
  # Language facilities with no cc:: equivalent
  # =========================================================================================================

  - kind: allow-include
    value: <ranges>
    reason: std::ranges::contiguous_range is what constrains the upload overloads, and cc:: has no range vocabulary
    files: src/shaped-graphics/command_list/upload.hh

  - kind: allow-include
    value: <cstdlib>
    reason: setenv, which is the whole of Metal's validation-layer API — the layer is configured through the environment and there is no call to make. See backends/metal/readme.md
    files: [backends/metal/src/shaped-graphics/backends/metal/metal_common.cc, backends/metal/tests/metal-validation-test.cc]

  - kind: allow-include
    value: <mutex>
    reason: callback_mutex needs a lock that is real with SC_THREADS off, because Metal's commit handlers run on a dispatch queue that flag does not reach — and cc::mutex compiles its lock away. The pipeline lock is the same need, for a driver that corrupts its own lock under concurrent compilation. See backends/metal/readme.md
    files: [backends/metal/src/shaped-graphics/backends/metal/metal_common.hh, backends/metal/src/shaped-graphics/backends/metal/metal_common.cc, backends/metal/src/shaped-graphics/backends/metal/metal_raster_pipeline.cc, backends/metal/src/shaped-graphics/backends/metal/metal_compute_pipeline.cc, backends/metal/src/shaped-graphics/backends/metal/metal_raytracing_pipeline.cc]

  # =========================================================================================================
  # Waiting on a migration
  # =========================================================================================================

  - kind: allow-include
    value: <shared_mutex>
    reason: no cc:: shared/exclusive lock yet — docs/TODO.md records the same gap for render routines, which want cc::shared_mutex<T> next to cc::mutex<T>. Move this there when it lands
    files: backends/vulkan/src/shaped-graphics/backends/vulkan/vulkan_driver_lock.hh

  - kind: allow-include
    value: <mutex>
    reason: std::unique_lock over the std::shared_mutex above, and <shared_mutex> does not guarantee it. Goes away with the same migration
    files: backends/vulkan/src/shaped-graphics/backends/vulkan/vulkan_driver_lock.hh

  - kind: allow-include
    value: <atomic>
    reason: "TODO: migrate to cc::atomic — these predate it, and until then the single-threaded build still pays for the atomics (routine/reload_generation.cc shows the target shape)"

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for, block_until_idle]
    reason: block_until_idle's own guarantees are tested here
    files:
      - tests/context/context-test.cc

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for, block_until_idle]
    reason: a fuzz step is a synchronous call the fuzzer sequences
    files:
      - tests/transfer/transfer-fuzz-test.cc

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for, block_until_idle]
    reason: a helper returning a finished pipeline, which its synchronous callers read at once
    files:
      - backends/dx12/tests/dx12-cached-pso-test.cc
