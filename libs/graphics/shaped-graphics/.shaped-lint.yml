# shaped-graphics's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
rules:
  # --- baseline begin: generated by `dev.py lint bless-includes` — curate by moving entries above this line ---
  - kind: allow-include
    value: <array>
    reason: baseline
  - kind: allow-include
    value: <atomic>
    reason: baseline
  - kind: allow-include
    value: <cstddef>
    reason: baseline
  - kind: allow-include
    value: <cstring>
    reason: baseline
  - kind: allow-include
    value: <d3d12.h>
    reason: baseline
  - kind: allow-include
    value: <d3d12sdklayers.h>
    reason: baseline
  - kind: allow-include
    value: <dxgi1_6.h>
    reason: baseline
  - kind: allow-include
    value: <memory>
    reason: baseline
  - kind: allow-include
    value: <ranges>
    reason: baseline
  - kind: allow-include
    value: <string>
    reason: baseline
  - kind: allow-include
    value: <thread>
    reason: baseline
  - kind: allow-include
    value: <utility>
    reason: baseline
  - kind: allow-include
    value: <variant>
    reason: baseline
  # --- baseline end ---
