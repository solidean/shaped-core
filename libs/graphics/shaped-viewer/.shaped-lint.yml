# shaped-viewer's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
#
# sv reaches for nothing outside cc:: and tg::, its tests included, bar the one entry below.
# That is the state to keep it in: a new one here is a claim that sv needs something the libraries below it do not provide.

rules:
  - kind: allow-include
    value: <memory>
    reason: sg hands out command lists as std::unique_ptr<sg::command_list> — polymorphic, so not cc::unique_ptr (shaped-graphics/docs/coding-guidelines.md argues it). fwd.hh is sv's single door to it; everything else includes fwd.hh
    files: src/shaped-viewer/fwd.hh

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for, block_until_idle]
    reason: a manual window test runs a real frame loop, which is where a wait belongs
    files:
      - tests/pathtraced-window-manual-test.cc
      - tests/viewer-window-manual-test.cc

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for, block_until_idle]
    reason: a frame is re-recorded until a path-traced state object lands, and nothing yet says when it has
    files:
      - tests/viewer_test_env.hh
      - tests/volumetric-furnace-test.cc

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for, block_until_idle]
    reason: the compile checks the synchronous material tests share, finished before they are read
    files:
      - tests/material-shader-cache-test.cc
      - tests/material-shader-compile-test.cc
