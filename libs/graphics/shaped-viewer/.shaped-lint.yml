# shaped-viewer's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
#
# sv's own sources reach for nothing outside cc:: and tg:: — the entries below are its manual tests alone.

rules:
  - kind: allow-include
    value: <cmath>
    reason: the camera paths these manual tests fly are spelled with sin / cos directly, rather than through a tg:: helper
    files: tests/**
