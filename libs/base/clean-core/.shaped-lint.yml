# clean-core's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
#
# clean-core is the bottom of the stack, so it is the library that has to touch the C runtime and the OS directly.
# Nearly every entry below is therefore scoped to the files that ARE that wrapper — a library-wide allow would say only that clean-core exists.

rules:
  # =========================================================================================================
  # The cc:: seams — the files the rest of the repo is pointed at instead
  # =========================================================================================================

  - kind: allow-include
    value: <atomic>
    reason: cc::atomic IS std::atomic when CC_HAS_THREADS — this file is the seam that replaces it when there are no threads
    files: src/clean-core/thread/atomic.hh

  - kind: allow-include
    value: [<mutex>, <condition_variable>]
    reason: cc::mutex is implemented over them, and cc::mutex::wait takes a std::condition_variable by reference
    files:
      - src/clean-core/thread/mutex.hh
      - src/clean-core/thread/async_thread_pool.hh
      - src/clean-core/thread/threaded_actor.hh

  - kind: allow-include
    value: <ctime>
    reason: localtime_s / localtime_r are the only portable route to a LOCAL calendar breakdown, and <chrono>'s zoned_time wants a tzdb
    files: src/clean-core/common/time.cc

  - kind: allow-include
    value: <chrono>
    reason: cc::current_time_steady_secs replaces it repo-wide; <chrono> is the standard library's most expensive header on MSVC (1.16 s, 148 files, via <format> and <xutility>) so it must never reach a header — see docs/notes/build-times.md. thread.cc is the one other .cc that needs it: std::this_thread::sleep_for takes a duration, and there is no portable way to spell one without <chrono>
    files: [src/clean-core/common/time.cc, src/clean-core/thread/thread.cc]

  - kind: allow-include
    value: [<cstddef>, <cstdint>]
    reason: fwd.hh is where the sized aliases everyone else uses are declared from
    files: src/clean-core/fwd.hh

  - kind: allow-include
    value: <Windows.h>
    reason: the one audited entry point — it defines NOMINMAX, brackets the `byte` typedef, and is what every other TU includes instead
    files: src/clean-core/platform/win32_sanitized.hh

  # =========================================================================================================
  # Language and compiler facilities a wrapper is built on
  # =========================================================================================================

  - kind: allow-include
    value: <bit>
    reason: cc::bit_ceil and friends forward to the std ones, which are compiler intrinsics
    files: src/clean-core/math/bit.hh

  - kind: allow-include
    value: <coroutine>
    reason: the language requires it for coroutine_handle and coroutine_traits, and this header is the only place cc::async's co_await layer needs them
    files: src/clean-core/thread/async_coroutine.hh

  - kind: allow-include
    value: <source_location>
    reason: cc::source_location wraps it, and only the compiler can produce one
    files: src/clean-core/platform/source_location.hh

  - kind: allow-include
    value: <stacktrace>
    reason: cc::stacktrace wraps std::stacktrace where the toolchain has it
    files: src/clean-core/platform/stacktrace.hh

  - kind: allow-include
    value: [<stdexcept>, <exception>]
    reason: the blessed route the rest of the repo reaches these two through, so the include sits in one place
    files: src/clean-core/error/exception.hh

  - kind: allow-include
    value: <new>
    reason: std::hardware_destructive_interference_size, and the placement-new declarations
    files:
      - src/clean-core/container/impl/allocating_container.hh
      - src/clean-core/container/small_vector.hh

  - kind: allow-include
    value: [<intrin.h>, <immintrin.h>]
    reason: the spin hint and the wide multiply are single instructions, reachable only as intrinsics
    files:
      - src/clean-core/thread/spin.hh
      - src/clean-core/math/wide_arith.hh

  - kind: allow-include
    value: <TargetConditionals.h>
    reason: the Apple platform macros CC_OS_* are derived from, and there is no other source for them
    files: src/clean-core/common/macros.hh

  # =========================================================================================================
  # The C runtime, in the files that are the wrapper
  # =========================================================================================================

  - kind: allow-include
    value: <cstring>
    reason: this file IS the seam — cc::memcpy and its siblings are aliases declared here, and everyone else goes through them
    files: src/clean-core/common/utility.hh

  - kind: allow-include
    value: <charconv>
    reason: from_chars / to_chars are what cc::to_string, cc::from_string and cc::format are implemented over
    files:
      - src/clean-core/string/format.cc
      - src/clean-core/string/to_string.cc
      - src/clean-core/string/from_string.cc

  - kind: allow-include
    value: <cstdio>
    reason: the process-wide stdout/stderr handles cc::print writes through
    files:
      - src/clean-core/string/print.cc
      - src/clean-core/common/assert.cc
      - src/clean-core/error/crash_handler.cc

  - kind: allow-include
    value: <cstdlib>
    reason: abort() and the raw allocator the memory resources are built on
    files:
      - src/clean-core/common/assert.cc
      - src/clean-core/error/crash_handler.cc
      - src/clean-core/memory/allocation.cc
      - src/clean-core/platform/console.cc
      - src/clean-core/platform/native.cc

  - kind: allow-include
    value: <new>
    reason: std::nothrow, so a chunk whose pin array spilled and could not allocate falls back to recording the value inline instead of throwing from a recording site
    files: src/clean-core/record/chunk.cc

  - kind: allow-include
    value: <memory>
    reason: a pin holds a cc::pinned_data's owner, which IS a std::shared_ptr<void const> — cc::shared_ptr supports neither the type erasure nor the aliasing that owner needs, which is why pinned_data.hh uses std:: too
    files: src/clean-core/record/pinned_value.cc

  - kind: allow-include
    value: <dbghelp.h>
    reason: SymFromAddr and SymGetLineFromAddr64 are the only route from an address to a name on Windows
    files: src/clean-core/platform/symbolize.cc

  - kind: allow-include
    value: <tlhelp32.h>
    reason: the thread and module snapshots are the only way to find what the recorder was never told about
    files:
      - src/clean-core/record/sampling.cc
      - src/clean-core/platform/module_table.cc

  - kind: allow-include
    value: <timeapi.h>
    reason: timeBeginPeriod and timeEndPeriod live there, and <Windows.h> does not pull them in under LEAN_AND_MEAN
    files: src/clean-core/thread/thread.cc

  - kind: allow-include
    value: [<pthread.h>, <unistd.h>]
    reason: gettid and pthread_threadid_np are the only routes to the OS's own thread id
    files: src/clean-core/thread/thread.cc

  - kind: allow-include
    value: <pthread.h>
    reason: a thread's stack bounds are what a frame-chain walk validates against, and pthread is the only source
    files: src/clean-core/platform/stack_capture.cc

  - kind: allow-include
    value: <csignal>
    reason: the crash handler installs signal handlers, which is what it is
    files: src/clean-core/error/crash_handler.cc

  - kind: allow-include
    value: <string>
    reason: std::to_string(std::stacktrace) is the only renderer that produces frame text, and it returns a std::string
    files: src/clean-core/error/crash_handler.cc

  - kind: allow-include
    value: <cerrno>
    reason: errno is how the POSIX file API reports failure
    files:
      - src/clean-core/streams/impl/native_file.cc
      - src/clean-core/platform/file_path.cc
      - src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: [<cstdio>, <cstdlib>]
    reason: std::remove deletes a file and std::getenv names the temp directory; POSIX offers no other route to either
    files: src/clean-core/platform/file_path.cc

  - kind: allow-include
    value: <cstdlib>
    reason: std::getenv is the only portable way to read the environment
    files: src/clean-core/platform/environment.cc

  - kind: allow-include
    value: <string>
    reason: std::to_string(std::stacktrace) is the only renderer that produces frame text, and it returns a std::string
    files: src/clean-core/common/assert.cc

  # =========================================================================================================
  # Platform APIs, each in the one TU that speaks to that OS
  # =========================================================================================================

  - kind: allow-include
    value: [<io.h>, <stdio.h>]
    reason: the Win32 console handles and isatty
    files: src/clean-core/platform/console.cc

  - kind: allow-include
    value: [<DbgHelp.h>, <cxxabi.h>]
    reason: symbol demangling — the Win32 and Itanium-ABI halves of cc::demangle
    files: src/clean-core/platform/native.cc

  - kind: allow-include
    value: [<dbghelp.h>, <tlhelp32.h>]
    reason: walking the stack and the thread list of a dying process
    files: src/clean-core/error/crash_handler.cc

  - kind: allow-include
    value: <mutex>
    reason: guards the process-wide DbgHelp session, which is not thread-safe — cc::mutex is layered above this file
    files: src/clean-core/platform/native.cc

  - kind: allow-include
    value: <sys/ioctl.h>
    reason: TIOCGWINSZ is the only route to a POSIX terminal's column count
    files: src/clean-core/platform/console.cc

  - kind: allow-include
    value: <unistd.h>
    reason: the POSIX half of isatty / write / file descriptors
    files:
      - src/clean-core/common/assert.cc
      - src/clean-core/platform/console.cc
      - src/clean-core/streams/impl/native_file.cc
      - src/clean-core/platform/file_path.cc
      - src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: <fcntl.h>
    reason: open() and its flags, the POSIX half of the native file stream
    files: src/clean-core/streams/impl/native_file.cc

  - kind: allow-include
    value: <intrin.h>
    reason: __cpuid — the CPU brand and vendor strings, which no Win32 call reports
    files: src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: <cpuid.h>
    reason: __get_cpuid — the same two strings on the GCC and Clang side
    files: src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: [<sys/sysctl.h>, <sys/time.h>]
    reason: sysctlbyname is the whole of Darwin's machine description, including the hw.perflevel* core-class split
    files: src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: [<mach/mach.h>, <mach/mach_host.h>, <mach/processor_info.h>, <sys/sysctl.h>]
    reason: host_statistics and host_processor_info are Darwin's only CPU and memory counters
    files: src/clean-core/platform/system_metrics.cc

  - kind: allow-include
    value: <unistd.h>
    reason: sysconf(_SC_CLK_TCK), the unit /proc/stat counts in
    files: src/clean-core/platform/system_metrics.cc

  - kind: allow-include
    value: [<sched.h>, <unistd.h>]
    reason: sched_getaffinity is the mask a container narrows, and sysconf is the fallback count
    files: src/clean-core/platform/resource_limits.cc

  - kind: allow-include
    value: [<intrin.h>, <cpuid.h>]
    reason: the CPUID hypervisor bit, which is the only in-process hint that this is a VM
    files: src/clean-core/platform/resource_limits.cc

  - kind: allow-include
    value: <sys/utsname.h>
    reason: uname, the kernel version Linux reports nowhere else
    files: src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: <cstdlib>
    reason: std::getenv is the only route to the startup timezone and locale
    files: src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: <unistd.h>
    reason: sysconf for the page size, and the logical core count on the targets that report nothing else
    files: src/clean-core/platform/system_info.cc

  - kind: allow-include
    value: [<iphlpapi.h>, <lmcons.h>, <winioctl.h>, <winsock2.h>, <ws2tcpip.h>]
    reason: GetAdaptersAddresses reports the hardware addresses and needs winsock2's structs, UNLEN bounds a Windows user name, and the storage descriptor carries the disk serial
    files: src/clean-core/platform/system_identifier.cc

  - kind: allow-include
    value: [<ifaddrs.h>, <net/if_dl.h>, <netpacket/packet.h>]
    reason: getifaddrs is the only portable route to an interface's hardware address, and the two link-layer headers are its per-OS address structs
    files: src/clean-core/platform/system_identifier.cc

  - kind: allow-include
    value: [<unistd.h>, <cstdlib>]
    reason: gethostname, and std::getenv for the account name
    files: src/clean-core/platform/system_identifier.cc

  - kind: allow-include
    value: <pthread.h>
    reason: pthread_setname_np — the POSIX half of cc::set_current_thread_name
    files: src/clean-core/thread/thread.cc

  # =========================================================================================================
  # Vendored third-party, each in the one TU that wraps it
  # =========================================================================================================

  - kind: allow-include
    value: <xxhash.h>
    reason: the hash implementation cc::hash / cc::hash128 forward to
    files:
      - src/clean-core/common/hash.cc
      - src/clean-core/bytes/hash128.cc

  - kind: allow-include
    value: <blake3.h>
    reason: the cryptographic hash cc::blake3 / cc::hash256 forward to
    files: src/clean-core/bytes/blake3.cc

  - kind: allow-include
    value: [<zstd.h>, <zdict.h>]
    reason: the Zstandard algorithm cc::compress forwards to
    files: src/clean-core/bytes/impl/zstd_backend.cc

  - kind: allow-include
    value: [<lz4.h>, <lz4frame.h>, <lz4hc.h>]
    reason: the LZ4 algorithm cc::compress forwards to
    files: src/clean-core/bytes/impl/lz4_backend.cc

  - kind: allow-include
    value: <zlib.h>
    reason: the Deflate algorithm cc::compress forwards to, for gzip, zlib and raw deflate alike
    files: src/clean-core/bytes/impl/deflate_backend.cc

  - kind: allow-include
    value: <mimalloc.h>
    reason: the allocator cc::mimalloc_resource wraps
    files: src/clean-core/memory/mimalloc_resource.cc

  # =========================================================================================================
  # Waiting on a cc:: replacement
  # =========================================================================================================

  - kind: allow-include
    value: <memory>
    reason: "TODO: std::shared_ptr / std::unique_ptr predate the cc:: ones here — migrate to clean-core/memory/"
    files:
      - src/clean-core/container/key_value_cache.hh
      - src/clean-core/container/pinned_data.hh
      - src/clean-core/thread/threaded_actor.hh

  # =========================================================================================================
  # The tests
  # =========================================================================================================
  # clean-core's tests exist to check cc:: types against the std:: ones they replace, so they are the one place
  # naming a std:: container is the point rather than a lapse.

  - kind: allow-include
    value: [<vector>, <string>, <string_view>, <array>, <list>, <memory>]
    reason: the std:: counterparts these tests compare cc:: types against, and convert to and from
    files: tests/**

  - kind: allow-include
    value: [<filesystem>, <fstream>]
    reason: fixture files for the stream tests, written and cleaned up outside the API under test
    files: tests/**

  - kind: allow-include
    value: <latch>
    reason: pins the moment every worker has started, which is what the actor test is asserting about
    files: tests/thread/threaded_actor-test.cc

  - kind: allow-include
    value: [<cstdio>, <cstdlib>, <cstdint>, <unistd.h>, <intrin.h>, <xxhash.h>, <blake3.h>]
    reason: the C runtime and the intrinsics the benchmarks and platform tests measure against
    files: tests/**

  - kind: allow-include
    value: <algorithm>
    reason: std::sort is the baseline cc::sort is measured against, which is the whole point of this file
    files: tests/benchmarks/sort-benchmark.cc
