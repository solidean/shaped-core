# nexus's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
#
# nexus is mid-migration off std::, and docs/stdlib-migration.md is the live inventory with what each site waits on.
# Everything in the "waiting on cc::" block below has an entry there; this file is the machine-checked half of it.

rules:
  # =========================================================================================================
  # Platform APIs, each in the one TU that speaks to that OS
  # =========================================================================================================

  - kind: allow-include
    value: [<evntcons.h>, <evntrace.h>]
    reason: the real-time ETW consumer the Windows hardware counters read context switches from
    files: src/nexus/bench/impl/hardware_counters_windows.cc

  - kind: allow-include
    value: <unistd.h>
    reason: the perf_event_open syscall wrapper for the Linux hardware counters
    files: src/nexus/bench/impl/hardware_counters_linux.cc

  - kind: allow-include
    value: <sched.h>
    reason: sched_setaffinity, the only way to pin a benchmark thread to one core on Linux
    files: src/nexus/bench/impl/platform_load_linux.cc

  - kind: allow-include
    value: <crt_externs.h>
    reason: _NSGetArgv is the only route to this process's argv on Apple platforms
    files: src/nexus/args/impl/os_args.cc

  - kind: allow-include
    value: <intrin.h>
    reason: _ReadWriteBarrier, which is what MSVC has instead of the inline asm it does not support on x64; guarded by CC_COMPILER_MSVC, so clang and gcc never see it
    files: src/nexus/bench/barriers.hh

  - kind: allow-include
    value: <cstdlib>
    reason: the CRT's __argc / __argv, which is what Windows has instead of /proc/self/cmdline
    files: src/nexus/args/impl/os_args.cc

  - kind: allow-include
    value: <cstdlib>
    reason: std::exit ends a run that returned to the JS event loop, which is the only way its exit code reaches node or deno
    files: src/nexus/impl/host_loop.cc


  # =========================================================================================================
  # Waiting on a cc:: replacement — see docs/stdlib-migration.md
  # =========================================================================================================

  - kind: allow-include
    value: <atomic>
    reason: "TODO: migrate to cc::atomic — the counter plumbing predates it"
    files: src/nexus/bench/**

  - kind: allow-include
    value: [<string>, <string_view>]
    reason: "TODO: migrate to cc::string — the runner's own strings predate it"
    files: src/**

  - kind: allow-include
    value: [<unordered_map>, <unordered_set>]
    reason: "TODO: cc::map has landed, the schedule and registry have not migrated"
    files: src/**

  # =========================================================================================================
  # The tests
  # =========================================================================================================

  - kind: allow-include
    value: [<string>, <vector>]
    reason: the std:: types an invocable test is parametrized over, which is what pins that nexus accepts them
    files: tests/**

  - kind: allow-blocking-wait
    value: [async_blocking_get, try_async_blocking_get, async_blocking_get_on, try_async_blocking_get_on, try_async_blocking_get_for]
    reason: the waits run on pools the test owns under no_scheduler, and where a check lands from them is the subject
    files:
      - tests/test-threaded-check-test.cc

  - kind: allow-include
    value: [<cstdio>, <cstdlib>]
    reason: a hang report writes through the stderr handle and ends the process with _Exit, for the same reason clean-core's crash handler does - a run too stuck to unwind cannot be left to run static destructors
    files: src/nexus/impl/watchdog.cc

  - kind: allow-include
    value: <thread>
    reason: the watchdog must run OUTSIDE the run it watches, which is what lets it notice a test that spins rather than waits
    files: src/nexus/impl/watchdog.cc
