# nexus's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
rules:
  # --- baseline begin: generated by `dev.py lint bless-includes` — curate by moving entries above this line ---
  - kind: allow-include
    value: <algorithm>
    reason: baseline
  - kind: allow-include
    value: <atomic>
    reason: baseline
  - kind: allow-include
    value: <cstdio>
    reason: baseline
  - kind: allow-include
    value: <cstring>
    reason: baseline
  - kind: allow-include
    value: <evntcons.h>
    reason: baseline
  - kind: allow-include
    value: <evntrace.h>
    reason: baseline
  - kind: allow-include
    value: <exception>
    reason: baseline
  - kind: allow-include
    value: <intrin.h>
    reason: baseline
  - kind: allow-include
    value: <iostream>
    reason: baseline
  - kind: allow-include
    value: <stdexcept>
    reason: baseline
  - kind: allow-include
    value: <string>
    reason: baseline
  - kind: allow-include
    value: <string_view>
    reason: baseline
  - kind: allow-include
    value: <unistd.h>
    reason: baseline
  - kind: allow-include
    value: <unordered_map>
    reason: baseline
  - kind: allow-include
    value: <unordered_set>
    reason: baseline
  - kind: allow-include
    value: <utility>
    reason: baseline
  - kind: allow-include
    value: <vector>
    reason: baseline
  - kind: allow-include
    value: <x86intrin.h>
    reason: baseline
  # --- baseline end ---
