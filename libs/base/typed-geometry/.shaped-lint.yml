# typed-geometry's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See tools/shaped-linter/docs/configuration.md.
#
# tg reaches for almost nothing: its own docs/coding-guidelines.md already says scalars go through scalar_traits, never std:: directly.
# The one entry below is that seam.

rules:
  - kind: allow-include
    value: <cmath>
    reason: scalar_traits is where sqrt / sin / cos are bound to a scalar type, so exotic scalars can override what std:: cannot
    files: src/typed-geometry/scalar/traits.hh

  - kind: allow-include
    value: <immintrin.h>
    reason: the F16C conversion intrinsics, compiled in only where the build target guarantees F16C
    files: src/typed-geometry/scalar/impl/half_float_convert.hh

  - kind: allow-include
    value: <cmath>
    reason: std::fma is the correctly rounded oracle the exact bigfloat msum is held against, and neither tg nor clean-core has a fused multiply-add
    files: tests/scalar/bigfloat-test.cc

  - kind: allow-include
    value: <immintrin.h>
    reason: the FMA instruction for an expansion's two_product, compiled in only where the build target guarantees FMA
    files: src/typed-geometry/scalar/float_expansion/impl/kernels.hh

  - kind: allow-include
    value: <cmath>
    reason: std::fma for an expansion's two_product on MSVC without FMA, since neither tg nor clean-core has a fused multiply-add
    files: src/typed-geometry/scalar/float_expansion/impl/kernels.hh
