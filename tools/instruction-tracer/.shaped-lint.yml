# instruction-tracer's lint policy, on top of the repo-root .shaped-lint.yml.
#
# The root's entries apply here too; what follows extends them, and the last matching entry decides.
# See ../shaped-linter/docs/configuration.md.

rules:
  - kind: allow-include
    value: <Zydis.h>
    reason: the disassembler the tracer decodes instructions with, confined to the two decode TUs
    files:
      - src/instruction-tracer/decode/instruction_decoder.cc
      - src/instruction-tracer/decode/memory_access.cc

  - kind: allow-include
    value: <DbgHelp.h>
    reason: the PDB symbol API a symbol session IS
    files: src/instruction-tracer/debug/symbol_session.cc

  - kind: allow-include
    value: <charconv>
    reason: from_chars is what the JSON reader parses numbers with
    files: src/instruction-tracer/report/json_reader.hh

  - kind: allow-include
    value: <filesystem>
    reason: resolving and walking the paths the tool is pointed at
    files: src/instruction-tracer/main.cc

  - kind: allow-include
    value: [<filesystem>, <fstream>, <string>]
    reason: fixture files these tests write and clean up, outside the API under test
    files: tests/**

  - kind: allow-include
    value: <cmath>
    reason: std::abs for the float comparison these tests round with
    files: tests/report/mca-test.cc
