# The repo-wide lint policy. Every library extends it with its own .shaped-lint.yml next to its readme.
#
# The format, the merge order and what a `files:` glob is relative to: tools/shaped-linter/docs/configuration.md.
# Why we avoid std:: at all: docs/coding-guidelines.md, section "Standard Library & Dependencies".
#
# What sits here is what holds for every library.
# A blessing only one library needs belongs in that library's file, scoped to the files that need it, and is written there rather than widened into this one.

rules:
  # =========================================================================================================
  # Blessed to include and to call
  # =========================================================================================================
  # The two tiers, and the argument for each header, are libs/base/clean-core/docs/blessed-stdlib-headers.md's.
  # What they share: the language or the compiler owns the facility, so a cc:: wrapper would wrap nothing.

  - kind: allow-include
    value: <type_traits>
    reason: thin wrappers around compiler intrinsics, and there is no value in re-wrapping them

  - kind: allow-include
    value: <concepts>
    reason: the standard concepts are spellings of compiler-known relations, same argument as <type_traits>

  - kind: allow-include
    value: <initializer_list>
    reason: the language itself requires it for braced-init-list constructors

  - kind: allow-include
    value: <compare>
    reason: the language itself requires it for operator<=>, and `= default` needs the ordering categories

  - kind: allow-include
    value: [<typeinfo>, <typeindex>]
    reason: typeid and its hashable handle are language-level RTTI, not something to reimplement

  - kind: allow-include
    value: <utility>
    reason: structured bindings need std::tuple_size / std::tuple_element specializations, which only this header declares

  # =========================================================================================================
  # No cc:: equivalent yet — allowed until one lands, then migrate
  # =========================================================================================================
  # These are NOT endorsements. Each is here because there is nothing better to reach for today.
  # When the cc:: replacement lands, the entry moves to the deny block below and the call sites move with it.

  - kind: allow-include
    value: <chrono>
    reason: no cc:: time vocabulary yet — OS clocks plus unit-safe duration algebra. Use steady_clock for elapsed time, never system_clock

  - kind: allow-include
    value: [<variant>, <tuple>]
    reason: cc::variant and cc::tuple are declared but not implemented (clean-core/container/) — migrate once they are

  - kind: allow-include
    value: <limits>
    reason: no cc:: numeric limits yet

  - kind: allow-include
    value: <algorithm>
    reason: no cc:: algorithm library yet

  - kind: allow-include
    value: <thread>
    reason: no cc:: thread type — clean-core/thread/thread.hh is helpers only. Prefer cc::threaded_actor or cc::async over a raw thread either way

  # =========================================================================================================
  # Denied, with the replacement named
  # =========================================================================================================
  # A deny is not redundant with the default: "not blessed" cannot point anywhere, and a reason can.
  # A library that genuinely needs one of these re-allows it in its own file, scoped to the files that do — which is where the deviation stays visible.

  - kind: deny-include
    value: [<vector>, <array>, <list>]
    reason: use cc::vector, cc::array (heap) or cc::fixed_array (inline)

  - kind: deny-include
    value: [<map>, <set>, <unordered_map>, <unordered_set>, <deque>, <forward_list>, <stack>, <queue>]
    reason: use cc::map / cc::set, or a cc::vector — see libs/base/clean-core/cheat-sheet.md

  - kind: deny-include
    value: [<string>, <string_view>]
    reason: use cc::string / cc::string_view

  - kind: deny-include
    value: <optional>
    reason: use cc::optional — clean-core/error/optional.hh

  - kind: deny-include
    value: <memory>
    reason: use cc::unique_ptr / cc::shared_ptr — clean-core/memory/. cc::shared_ptr is not feature-complete yet (no weak_ptr, no aliasing ctor), so a library that needs what is missing overrides this with the gap named

  - kind: deny-include
    value: <span>
    reason: use cc::span

  - kind: deny-include
    value: <functional>
    reason: use cc::function_ref (non-owning) or cc::unique_function (owning)

  - kind: deny-include
    value: [<format>, <sstream>, <iomanip>, <ostream>, <istream>, <streambuf>]
    reason: use cc::format / cc::format_to — clean-core/string/format.hh

  - kind: deny-include
    value: [<iostream>, <fstream>]
    reason: use cc::print / cc::println / cc::eprintln, and clean-core/streams/ for files

  - kind: deny-include
    value: [<mutex>, <shared_mutex>, <condition_variable>]
    reason: use cc::mutex — clean-core/thread/mutex.hh owns both the data and the lock protecting it

  - kind: deny-include
    value: <atomic>
    reason: use cc::atomic — clean-core/thread/atomic.hh, the seam that drops atomicity when CC_HAS_THREADS is 0

  - kind: deny-include
    value: [<cstddef>, <cstdint>]
    reason: use clean-core/fwd.hh — it declares the sized aliases (u32, isize, byte, …) and pulls in offsetof / std::size_t with them

  - kind: deny-include
    value: [<stdexcept>, <exception>]
    reason: prefer returning a cc::result; where something is genuinely exceptional, reach the std types through clean-core/error/exception.hh

  - kind: deny-include
    value: <cstring>
    reason: use cc::memcpy / cc::memmove / cc::memset / cc::memcmp — clean-core/common/utility.hh. For strlen and strcmp use a cc::string_view instead, which knows its size and compares with ==

  - kind: deny-include
    value: <cmath>
    reason: go through tg — tg::sin / tg::cos take a tg::angle, and tg::sqrt and friends dispatch on scalar_traits, which a std:: call cannot

  - kind: deny-include
    value: [<Windows.h>, <windows.h>]
    reason: use clean-core/platform/win32_sanitized.hh — it defines NOMINMAX, brackets the `byte` typedef and is safe to include on any platform
