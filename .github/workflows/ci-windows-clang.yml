name: Windows Clang

# Tier-1 native gate: Windows clang-cl, RelWithDebInfo, build + tests.
# Wide-but-shallow gate (single config); the deep debug/release matrix lives in
# ci-linux-clang.yml. Everything runs through dev.py with an explicit preset (no
# default-preset reliance). Uses the runner's CMake and Ninja, and the MSVC environment dev.py injects for clang-cl via vswhere.
# LLVM is the one exception to taking the image's toolchain: see "Install LLVM 22" below.
# clang-cl ships as a single unversioned binary (no clang++-N to swap to), so --toolset 22 here *asserts* clang-cl is version 22 rather than selecting it.
# See docs/guides/ci.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    # The one job that runs the dx12 GPU tests on WARP; every other Windows job sets SC_DX12_ADAPTER=hardware to skip them.
    # Those binaries declare a longer timeout (SG_WARP_TEST_BINARY_ARGS), which is what WARP's shader JIT costs here.
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Workaround, temporary: the image's MSVC 14.52 STL refuses anything below Clang 22 (STL1000), and the image still ships LLVM 20.1.8.
      # Drop this step, and go back to the image's LLVM with its version in --toolset, once the image ships clang-cl 22 or newer.
      # Pinned, since an unversioned install moves whenever upstream does.
      - name: Install LLVM 22 (image LLVM is older than its STL accepts)
        run: choco install llvm --version=22.1.8 --allow-downgrade --no-progress -y

      # Runner image 20260728.188 stopped putting LLVM's bin on PATH; 20260714.173 still did.
      # The preset's `CMAKE_CXX_COMPILER: clang-cl` is a bare name, so losing PATH reads as "no version-N compiler"
      # rather than as the environment change it is.
      # Fails loudly here instead, if LLVM ever lands anywhere but the standard location.
      - name: Put LLVM on PATH
        run: |
          $llvm = "$env:ProgramFiles\LLVM\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) { throw "no clang-cl.exe under $llvm - the image moved LLVM" }
          Add-Content $env:GITHUB_PATH $llvm

      # Informational only: doctor also probes clangd's compile DB and llvm-cov,
      # which aren't needed for build+test and would fail a fresh runner.
      - name: Doctor (toolchain info)
        run: uv run dev.py doctor --preset relwithdebinfo-clang --toolset 22
        continue-on-error: true

      # The dx12 tests run on Microsoft's NuGet WARP rather than the image's own, which traces some scenes wrong
      # (docs/bugs-external/warp-raytracing-wrong-capture). On request, since its terms are testing-only: extern/warp/dependency.yml.
      # Before Build, because the configure is what finds it and stages it beside the WARP test binaries.
      - name: Fetch the pinned WARP
        run: uv run extern/warp/fetch-warp.py

      # The dx12 backend creates its devices through the Agility SDK's runtime where it was fetched, which is what
      # brings Shader Model 6.9 and the features that need it. On request, since its terms are Microsoft's DirectX
      # license, accepted here for the CI runners: extern/agility/dependency.yml.
      - name: Fetch the pinned Agility SDK
        run: uv run extern/agility/fetch-agility.py --accept-license

      - name: Build
        run: uv run dev.py --collect-logs build/ci-logs.zip build --preset relwithdebinfo-clang --toolset 22 --diag-archive build/ci-diag.zip --keep-going

      - name: Test
        run: uv run dev.py --collect-logs build/ci-logs.zip test --preset relwithdebinfo-clang --toolset 22 --merged-xml-report build/ci-test-results.xml

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clang-diagnostics
          path: |
            build/ci-test-results.xml
            build/ci-diag.zip
            build/ci-logs.zip
          if-no-files-found: warn
