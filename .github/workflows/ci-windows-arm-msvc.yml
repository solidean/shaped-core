name: Windows ARM MSVC (VS2022)

# Tier-1 wide-but-shallow gate: Windows arm64 MSVC (cl), RelWithDebInfo, build +
# tests, on the windows-11-arm image (native arm64, Visual Studio 2022). The
# arm64-windows-msvc preset sets the CMake architecture/host toolset to arm64;
# dev.py threads the preset arch into the vcvars -arch so cl targets arm64 rather
# than x64. --toolset 14.44 pins the MSVC toolset (a hard error if absent rather
# than silently using a different default). The checked-in diag-launcher.exe is
# x64 and runs under Windows-11-ARM x64 emulation. See docs/guides/ci.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-11-arm
    env:
      # WARP runs the GPU tests on the Windows Clang job alone: it is slow enough that one job is what CI can afford.
      # Hiding it makes every dx12 driver here skip, since the runner has no GPU either.
      SC_DX12_ADAPTER: hardware
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # PROBE (throwaway branch): the standalone WARP reproduction alone, built with the arm64 MSVC toolchain.
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: WARP reproduction
        run: uv run docs/bugs-external/warp-arm64-pac-fastfail/run.py
