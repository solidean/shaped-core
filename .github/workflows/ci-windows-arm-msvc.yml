name: Windows ARM MSVC (VS2022)

# Tier-1 wide-but-shallow gate: Windows arm64 MSVC (cl), RelWithDebInfo, build +
# tests, on the windows-11-arm image (native arm64, Visual Studio 2022). The
# arm64-windows-msvc preset sets the CMake architecture/host toolset to arm64;
# dev.py threads the preset arch into the vcvars -arch so cl targets arm64 rather
# than x64. --toolset 14.44 pins the MSVC toolset (a hard error if absent rather
# than silently using a different default). The checked-in diag-launcher.exe is
# x64 and runs under Windows-11-ARM x64 emulation. See docs/guides/ci.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-11-arm
    env:
      # WARP runs the GPU tests on the Windows Clang job alone: it is slow enough that one job is what CI can afford.
      # Hiding it makes every dx12 driver here skip, since the runner has no GPU either.
      SC_DX12_ADAPTER: hardware
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Informational only: doctor also probes clangd's compile DB and llvm-cov,
      # which aren't needed for build+test and would fail a fresh runner.
      - name: Doctor (toolchain info)
        run: uv run dev.py doctor --preset relwithdebinfo-arm64-windows-msvc --toolset 14.44
        continue-on-error: true

      - name: Build
        run: uv run dev.py --collect-logs build/ci-logs.zip build -t shaped-viewer-test --preset relwithdebinfo-arm64-windows-msvc --toolset 14.44 --diag-archive build/ci-diag.zip --keep-going

      # PROBE (throwaway branch): a full dump of whatever fastfails, since a fastfail bypasses our crash handler.
      - name: Enable crash dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\dumps | Out-Null
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpFolder -Value 'C:\dumps' -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting' -Name Disabled -Value 0 -ErrorAction SilentlyContinue
          $cdb = Get-ChildItem -Recurse 'C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64' -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "cdb: $($cdb.FullName)"
          $script = @(
            'sxe -c ".echo ===FAULT===; .lastevent; .ecxr; kn 80; .echo ===ALL===; ~*kn 50; .dump /ma C:\dumps\fastfail.dmp; q" c0000409',
            'sxe -c ".echo ===AV===; .lastevent; .ecxr; kn 80; .echo ===ALL===; ~*kn 50; .dump /ma C:\dumps\av.dmp; q" av',
            'g'
          )
          Set-Content -Path C:\dumps\probe.cdb -Value $script -Encoding ascii
          "SC_PROBE_CDB=$($cdb.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SC_PROBE_CDB_SCRIPT=C:\dumps\probe.cdb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "_NT_SYMBOL_PATH=srv*C:\symcache*https://msdl.microsoft.com/download/symbols" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        continue-on-error: true
        run: uv run dev.py --collect-logs build/ci-logs.zip test shaped-viewer-test --preset relwithdebinfo-arm64-windows-msvc --toolset 14.44 --merged-xml-report build/ci-test-results.xml

      - name: Read the dump
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem C:\dumps -ErrorAction SilentlyContinue | Format-Table Name, Length
          $exe = Get-ChildItem -Recurse build -Filter shaped-viewer-test.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force build\probe | Out-Null
          Copy-Item C:\dumps\* build\probe -ErrorAction SilentlyContinue
          if ($exe) { Copy-Item $exe.FullName build\probe; Copy-Item ($exe.FullName -replace '\.exe$', '.pdb') build\probe -ErrorAction SilentlyContinue }
          $cdb = Get-ChildItem -Recurse 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'arm64' } | Select-Object -First 1
          if (-not $cdb) { $cdb = Get-ChildItem -Recurse 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          Write-Host "cdb: $($cdb.FullName)"
          $dump = Get-ChildItem C:\dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cdb -and $dump -and $exe) {
            & $cdb.FullName -z $dump.FullName -y "$($exe.DirectoryName);srv*C:\symcache*https://msdl.microsoft.com/download/symbols" -c ".ecxr; .echo ===FAULT===; kn 60; .echo ===ALL===; ~*kn 40; q" | Tee-Object build\probe\stacks.txt
          }

      - name: Upload the dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-crash-dump
          path: build/probe
          if-no-files-found: warn

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-msvc-diagnostics
          path: |
            build/ci-test-results.xml
            build/ci-diag.zip
            build/ci-logs.zip
          if-no-files-found: warn
