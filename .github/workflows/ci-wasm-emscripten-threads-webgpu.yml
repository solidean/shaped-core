name: WASM (Emscripten threads + WebGPU)

# The threads-plus-WebGPU wasm build, tests run under Node with Dawn's binding as navigator.gpu.
# It exists for the build and harness paths those two knobs switch on, since a runner has no GPU: every GPU test SKIPs for want of an adapter.
# dev.py's configure installs the pinned `webgpu` npm package (tools/dev/js), and the summary step prints how many tests skipped so a green run cannot pass for GPU coverage.
# See docs/guides/ci.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: 6.0.9
  EMSDK_CACHE: emsdk-cache
  # The native `sgl` the shader packages are generated with, built in the host preset: the Linux clang job's compiler.
  SC_HOST_TOOLSET: "21"

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ${{ env.EMSDK_CACHE }}
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-threads-webgpu

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: ${{ env.EMSDK_CACHE }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Informational only; --emsdk-path lets doctor validate the emsdk toolchain.
      - name: Doctor (toolchain info)
        run: uv run dev.py doctor --preset emscripten-threads-webgpu-relwithdebinfo --emsdk-path "$EMSDK"
        continue-on-error: true

      # Emscripten presets don't use the diag launcher, so --diag-archive is
      # near-empty here; the --collect-logs bundle carries the captured emcc output.
      - name: Build
        run: uv run dev.py --collect-logs build/ci-logs.zip build --preset emscripten-threads-webgpu-relwithdebinfo --emsdk-path "$EMSDK" --diag-archive build/ci-diag.zip --keep-going

      - name: Test
        run: uv run dev.py --collect-logs build/ci-logs.zip test --preset emscripten-threads-webgpu-relwithdebinfo --emsdk-path "$EMSDK" --merged-xml-report build/ci-test-results.xml

      - name: Skipped GPU tests
        if: always()
        run: |
          if [ -f build/ci-test-results.xml ]; then
            echo "skipped test cases: $(grep -o '<skipped' build/ci-test-results.xml | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-emscripten-threads-webgpu-diagnostics
          path: |
            build/ci-test-results.xml
            build/ci-diag.zip
            build/ci-logs.zip
          if-no-files-found: warn
